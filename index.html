<body>
<header>
  <h1>Buxgalter <b>paneli</b> <span id="syn" class="mut" style="font-size:12px"></span></h1>
  <div class="row"><select id="co" class="co"></select><input id="mo" class="mo" type="month"></div>
</header>
<main id="v"></main>
<nav id="nav"></nav>

<script>
const KEY='buxgalter_panel_v1', VAT=12;
const TABS=[['bosh','Bosh'],['hujjat','Hujjat'],['bank','Bank'],['qqs','Soliq'],['muddat','Muddat'],['arxiv','Arxiv'],['namuna','Namuna'],['bot','Yordamchi']];
function blank(){return{docs:[],bank:[],dl:[],files:[],chat:[]}}
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.cos)return r}catch(e){}
  return{co:'KROFF',month:new Date().toISOString().slice(0,7),tab:'bosh',cos:{'KROFF':blank(),'AMS':blank(),'Drive Upgrade':blank()}};
}
let S=load();S.cfg=S.cfg||{};S.hash=S.hash||{};S.lastPull=S.lastPull||0;
const TAXDEF={'KROFF':{mode:'aylanma',rate:4},'AMS':{mode:'qqs',rate:12},'Drive Upgrade':{mode:'qqs',rate:12}};
Object.keys(S.cos).forEach(c=>{S.cos[c].tax=S.cos[c].tax||Object.assign({},TAXDEF[c]||{mode:'qqs',rate:12});S.cos[c].files=S.cos[c].files||[]});
function taxOf(d){return d.tax||{mode:'qqs',rate:12}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncSoon()}
const D=()=>S.cos[S.co];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const vatOf=d=>d.vat?d.sum*VAT/(100+VAT):0;

/* ---- hisob-kitob ---- */
function reconcile(d){
  const used=new Set(),by={};
  d.docs.forEach(doc=>{if(!doc.link)return;const b=d.bank.find(x=>x.id===doc.link&&!used.has(x.id));
    if(b){used.add(b.id);by[doc.id]={doc,b,st:b.sum===doc.sum?'ok':'diff',diff:b.sum-doc.sum,linked:true}}});
  d.docs.forEach(doc=>{
    if(by[doc.id])return;
    const dir=doc.type==='sotuv'?'in':'out';
    const c=d.bank.filter(b=>!used.has(b.id)&&b.dir===dir);
    let b=c.find(x=>x.sum===doc.sum);
    if(b){used.add(b.id);by[doc.id]={doc,b,st:'ok',diff:0};return}
    b=doc.no&&c.find(x=>x.desc.toLowerCase().includes(doc.no.toLowerCase()));
    if(b){used.add(b.id);by[doc.id]={doc,b,st:'diff',diff:b.sum-doc.sum};return}
    by[doc.id]={doc,b:null,st:'none',diff:0};
  });
  return{rows:d.docs.map(x=>by[x.id]),extra:d.bank.filter(b=>!used.has(b.id))};
}
function debts(d){
  const r=reconcile(d),rec={},pay={};
  r.rows.forEach(x=>{
    let amt=0;if(x.st==='none')amt=x.doc.sum;else if(x.st==='diff'&&x.diff<0)amt=-x.diff;
    if(amt<=0)return;
    const m=x.doc.type==='sotuv'?rec:pay,k=(x.doc.party||'(nomsiz)').trim(),kk=k.toLowerCase();
    m[kk]=m[kk]||{party:k,sum:0,n:0};m[kk].sum+=amt;m[kk].n++;
  });
  const f=m=>Object.values(m).sort((a,b)=>b.sum-a.sum);
  return{rec:f(rec),pay:f(pay)};
}
function debtsHtml(d){
  const db=debts(d),row=(a,c)=>a.slice(0,5).map(x=>`<div class="item"><span>${esc(x.party)} <span class="mut">(${x.n})</span></span><b class="${c}">${fmt(x.sum)}</b></div>`).join('')||'<div class="mut">—</div>';
  if(!db.rec.length&&!db.pay.length)return'<div class="card"><h2>Qarzlar</h2><span class="mut">Bank tasdiqlamagan qarz yoʻq.</span></div>';
  return`<div class="card"><h2>Qarzlar (bank tasdiqlamagan)</h2><div class="mut">Mijozlar sizga:</div>${row(db.rec,'ok')}<div class="mut" style="margin-top:8px">Siz taʼminotchilarga:</div>${row(db.pay,'warn')}</div>`;
}
function stats(d,m){
  const ds=d.docs.filter(x=>x.date.startsWith(m));
  const s=ds.filter(x=>x.type==='sotuv'),h=ds.filter(x=>x.type==='xarid');
  const sum=a=>a.reduce((t,x)=>t+x.sum,0), v=a=>a.reduce((t,x)=>t+vatOf(x),0);
  const out=v(s),inn=v(h);
  const tx=taxOf(d),turn=sum(s)*tx.rate/100;
  return{sales:sum(s),buys:sum(h),outVat:out,inVat:inn,pay:out-inn,turn,tax:tx.mode==='qqs'?out-inn:turn,mode:tx.mode,rate:tx.rate,profit:sum(s)-sum(h),n:ds.length};
}
function daysLeft(dt){return Math.ceil((new Date(dt+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5)}
function nextMonthDay(m,day){const[y,mm]=m.split('-').map(Number);const dt=new Date(y,mm,day);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}

/* ---- ekranlar ---- */

let PEND=null;
function normDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return new Date(v.getTime()+432e5).toISOString().slice(0,10);
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[1]+'-'+m[2]+'-'+m[3];
  if(m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return null;
}
function num(v){
  if(typeof v==='number')return v;
  if(v==null)return NaN;
  let s=String(v).replace(/[\s\u00a0]/g,'');
  if(s==='')return NaN;
  if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');
  else if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(',','.');
  return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN;
}
function readRows(file){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onerror=()=>rej(new Error('Fayl oʻqilmadi'));
  fr.onload=()=>{try{
    const buf=fr.result;
    if(/\.xlsx?$/i.test(file.name)){
      if(!window.XLSX)throw new Error('Excel kutubxonasi yuklanmadi (internet kerak)');
      const wb=XLSX.read(buf,{type:'array',cellDates:true});
      return res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}));
    }
    let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder('windows-1251').decode(buf)}
    const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    const dl=['#',';','\t','|',','].map(c=>[c,lines.slice(0,20).reduce((a,l)=>a+(l.split(c).length-1),0)]).sort((a,b)=>b[1]-a[1])[0][0];
    res(lines.map(l=>l.split(dl).map(x=>x.trim())));
  }catch(e){rej(e)}};
  fr.readAsArrayBuffer(file);
})}
function guess(rows){
  const sm=rows.slice(0,200),n=Math.max(0,...sm.map(r=>r.length)),dc=[],nu=[],tx=[];
  for(let i=0;i<n;i++){let d=0,m=0,t=0,c=0,mx=0;
    sm.forEach(r=>{const v=r[i];if(v===''||v==null)return;c++;
      if(normDate(v))d++;else if(!isNaN(num(v))){m++;mx=Math.max(mx,Math.abs(num(v)))}else t+=String(v).length});
    dc.push(d);nu.push(m>=2&&mx>=1000?m:0);tx.push(c?t/c:0)}
  const date=dc.indexOf(Math.max(...dc)),numc=[];
  nu.forEach((m,i)=>{if(i!==date&&m>0)numc.push(i)});
  return{date,desc:tx.indexOf(Math.max(...tx)),num:numc};
}
function opts(rows,ref,sel,none){
  const n=Math.max(0,...rows.slice(0,50).map(r=>r.length));
  let h=none?`<option value="-1" ${sel===-1?'selected':''}>— yoʻq —</option>`:'';
  for(let i=0;i<n;i++)h+=`<option value="${i}" ${i===sel?'selected':''}>${i+1}: ${esc(String(ref[i]??'').slice(0,18))}</option>`;
  return h;
}
function importCard(kind){
  const bank=kind==='bank';
  let h=`<div class="card"><h2>${bank?'Bank':'Hujjat'} · fayldan yuklash</h2><input id="f_${kind}" type="file" accept=".xlsx,.xls,.csv,.txt,.tsv"><div class="note">Excel, CSV yoki TXT. Keyin ustunlarni tanlaysiz. Qayta yuklasangiz takrorlar qoʻshilmaydi.</div>${bank?'<div style="margin-top:8px"><button class="s" data-a="clrbank">Bank harakatlarini tozalash</button></div>':''}</div>`;
  if(PEND&&PEND.kind===kind){
    const g=guess(PEND.rows),ref=PEND.rows.find(r=>r.some(v=>normDate(v)))||PEND.rows[0]||[];
    const nm=(l,id,sel,none)=>`<div><label class="mut">${l}</label><select id="${id}">${opts(PEND.rows,ref,sel,none)}</select></div>`;
    const body=bank
      ?nm('Sana','m_date',g.date)+nm('Izoh (hujjat raqami shu yerda)','m_desc',g.desc)+nm('Kirim yoki summa','m_in',g.num[0]??-1,true)+nm('Chiqim (alohida ustun boʻlsa)','m_out',g.num[1]??-1,true)
      :nm('Sana','m_date',g.date)+nm('Hujjat raqami','m_no',-1,true)+nm('Kontragent','m_party',g.desc,true)+nm('Summa','m_sum',g.num[0]??-1)+nm('Turi (sotuv/xarid)','m_type',-1,true)
        +'<div><label class="mut">Turi (ustun boʻlmasa)</label><select id="m_dtype"><option value="sotuv">Sotuv</option><option value="xarid">Xarid</option></select></div><div><label class="mut">QQS</label><select id="m_dvat"><option value="1">QQS bilan</option><option value="0">QQS yoʻq</option></select></div>';
    h+=`<div class="card"><h2>Ustunlarni tanlang · ${PEND.rows.length} qator</h2><div class="f">${body}<button class="p" data-a="map${kind}">Yuklash</button><button data-a="mapcancel">Bekor</button></div></div>`;
  }
  return h;
}
function checks(d){
  const L=[],r=reconcile(d),t=today(),s=stats(d,S.month);
  const none=r.rows.filter(x=>x.st==='none'),diff=r.rows.filter(x=>x.st==='diff');
  if(none.length)L.push({c:'bad',t:`${none.length} ta hujjat bankda topilmadi (${fmt(none.reduce((a,x)=>a+x.doc.sum,0))} soʻm)`,
    w:'toʻlov hali qilinmagan (qarz), boshqa hisob raqamdan oʻtgan, yoki bank izohida hujjat raqami yoʻq va summa boshqacha.',
    f:'Qarz boʻlsa uni muddat bilan yozib qoʻying. Toʻlangan boʻlsa “Bank” boʻlimida koʻchirmani yangilang.'});
  if(diff.length)L.push({c:'warn',t:`${diff.length} ta hujjatda summa farqi bor (jami ${fmt(diff.reduce((a,x)=>a+x.diff,0))} soʻm)`,
    w:'qisman toʻlov, chegirma, bank komissiyasi yoki hujjatga summa xato kiritilgan boʻlishi mumkin.',
    f:'“Bank” boʻlimida farqli qatorni oching, hujjat va toʻlov summasini solishtiring. Kerak boʻlsa hujjatni tuzating.'});
  if(r.extra.length)L.push({c:'warn',t:`${r.extra.length} ta bank harakati hujjatsiz (${fmt(r.extra.reduce((a,b)=>a+b.sum,0))} soʻm)`,
    w:'avans, kredit yoki qarz, ichki oʻtkazma, soliq toʻlovi yoki hujjat hali kiritilmagan.',
    f:'Har birining sababini aniqlang. Hujjati yoʻq boʻlsa, hujjatni kiriting yoki buxgalteriyada toʻgʻri hisobga qoʻying.'});
  const seen={};d.docs.forEach(x=>{if(!x.no)return;const k=x.type+'|'+x.no.toLowerCase()+'|'+(x.party||'').toLowerCase();seen[k]=(seen[k]||0)+1});
  const dup=Object.keys(seen).filter(k=>seen[k]>1);
  if(dup.length)L.push({c:'bad',t:`${dup.length} ta hujjat raqami takrorlangan`,w:'bir hujjat ikki marta kiritilgan boʻlishi mumkin. Bu summani va QQSni ikki hissa qiladi.',f:'“Hujjat” roʻyxatida bir xil raqamli qatorlarni topib, ortiqchasini oʻchiring.'});
  const fut=d.docs.filter(x=>x.date>t).length;
  if(fut)L.push({c:'warn',t:`${fut} ta hujjat kelajak sanasi bilan`,w:'sana xato yozilgan boʻlishi mumkin.',f:'Sanani tekshiring.'});
  const nn=d.docs.filter(x=>!x.no).length;
  if(nn)L.push({c:'warn',t:`${nn} ta hujjatda raqam yoʻq`,w:'raqamsiz hujjatni bank toʻlovi bilan faqat summa orqali bogʻlash mumkin, bu xatoga olib kelishi mumkin.',f:'Hujjat raqamini kiriting.'});
  if(s.mode==='qqs'&&s.inVat>s.outVat&&s.inVat>0)L.push({c:'warn',t:`${S.month}: xariddan QQS sotuvdagidan katta`,w:'oy davomida koʻproq xarid qilingan yoki sotuv hujjatlari hali kiritilmagan.',f:'Sotuv hujjatlari toʻliqligini tekshiring. Ortiqcha QQSni keyingi oyga oʻtkazish yoki qaytarish masalasini buxgalter bilan hal qiling.'});
  d.dl.filter(x=>!x.done).forEach(x=>{const n=daysLeft(x.date);
    if(n<0)L.push({c:'bad',t:`Muddat oʻtgan: ${esc(x.title)} (${-n} kun)`,w:'muddat oʻtib ketgan va bajarilgan deb belgilanmagan.',f:'Bajarilgan boʻlsa ✓ bosing. Boʻlmasa darrov bajaring, jarima boʻlishi mumkin.'});
    else if(n<=5)L.push({c:'warn',t:`Yaqin muddat: ${esc(x.title)} (${n} kun qoldi)`,w:'muddatga oz qoldi.',f:'Hujjatlarni tayyorlang.'})});
  return L;
}
function ckHtml(d){
  if(!d.docs.length&&!d.bank.length&&!d.dl.length)return '<span class="mut">Maʼlumot yoʻq. Hujjat va bank yuklang yoki “Namuna maʼlumot”ni bosing.</span>';
  const ck=checks(d);
  return ck.length?ck.map(x=>`<details class="ck"><summary class="${x.c}">${x.t}</summary><div class="mut" style="margin-top:6px"><b>Nega:</b> ${x.w}<br><b>Nima qilish:</b> ${x.f}</div></details>`).join(''):'<span class="ok">Muammo topilmadi.</span>';
}
const TEACH={
 qqs:'QQS (12%) hisobi:\n1) Sotuv fakturalaridagi QQS, bu siz mijozdan olgan.\n2) Xarid fakturalaridagi QQS, bu siz taʼminotchiga toʻlagan.\n3) Farq (1 − 2) davlatga toʻlanadi.\nFaqat “QQS bilan” kiritilgan hujjatlar hisoblanadi. Aylanma soliq toʻlovchida QQS boʻlmaydi: bunday hujjatni “QQS yoʻq” deb kiriting. Topshirishdan oldin buxgalter bilan tekshiring.',
 osv:'1C dan hisobot olish:\n1) Отчеты → Оборотно-сальдовая ведомость.\n2) Davrni tanlang, Сформировать.\n3) Excelga saqlash: hisobotda Ctrl+S, turini “Лист Excel (*.xlsx)” qiling.\nHozircha ОСВ ni panel oʻqimaydi. Keyingi versiyada qoʻshamiz.',
 bank:'Bank faylini yuklash:\n1) Bankdan koʻchirmani TXT yoki Excel qilib yuklab oling.\n2) Panelda “Bank” boʻlimida “fayldan yuklash” orqali tanlang.\n3) Ustunlarni koʻrsating: sana, izoh, kirim/chiqim. Birinchi marta shuning uchun 1 daqiqa ketadi.\nQayta yuklasangiz takrorlar qoʻshilmaydi.',
 aylanma:'Aylanma soliq: baza davr daromadi (aylanma), foyda emas. Soliq = aylanma × stavka. Bunda QQS alohida hisoblanmaydi, xarid xarajatlari soliqni kamaytirmaydi. Hisobot muddatini “Muddat” boʻlimiga qoʻying. “Soliq” boʻlimida rejim va stavkani oʻzgartirish mumkin, hisob taxminiy.',
 didox:'Didox fakturalari:\nAgar Didox roʻyxatni Excel yoki CSV qilib bersa, “Hujjat” boʻlimidan fayl sifatida yuklang va ustunlarni tanlang. Zip arxivdagi fakturalarni toʻgʻridan-toʻgʻri oʻqishni keyingi versiyada qoʻshamiz.'
};

/* ---- bulut (Supabase) ---- */
let busy=false,t0=null;
const setSyn=t=>{const e=$('syn');if(e)e.textContent=t};
function setSess(j){S.sess={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000-60000}}
async function cloudLogin(email,pw){
  const r=await fetch(S.cfg.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:S.cfg.key,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Kirish xato');setSess(j);
}
async function ensureAuth(){
  if(!S.sess)throw new Error('Kirilmagan');
  if(Date.now()<S.sess.exp)return;
  const r=await fetch(S.cfg.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:S.cfg.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.sess.rt})});
  const j=await r.json();if(!r.ok){S.sess=null;throw new Error('Qayta kiring')}setSess(j);
}
async function sb(path,opt){
  opt=opt||{};await ensureAuth();
  const r=await fetch(S.cfg.url+'/rest/v1/'+path,{method:opt.method||'GET',body:opt.body,headers:Object.assign({apikey:S.cfg.key,Authorization:'Bearer '+S.sess.at,'Content-Type':'application/json'},opt.headers||{})});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,140));
  return r.status===204?null:r.json();
}
const arrOf=(d,k)=>k==='doc'?d.docs:k==='bank'?d.bank:k==='file'?(d.files=d.files||[]):d.dl;
async function syncPush(){
  const up=[],seen={};
  Object.keys(S.cos).forEach(co=>['doc','bank','dl','file'].forEach(k=>arrOf(S.cos[co],k).forEach(x=>{
    const key=co+'|'+k+'|'+x.id,js=JSON.stringify(x);seen[key]=1;
    if(S.hash[key]!==js)up.push({co,kind:k,id:x.id,data:x,deleted:false,ts:Date.now(),_k:key,_js:js})})));
  Object.keys(S.hash).forEach(key=>{if(!seen[key]){const p=key.split('|');up.push({co:p[0],kind:p[1],id:p[2],data:{},deleted:true,ts:Date.now(),_k:key,_js:null})}});
  for(let i=0;i<up.length;i+=400){
    const part=up.slice(i,i+400);
    await sb('rows?on_conflict=co,kind,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(part.map(u=>({co:u.co,kind:u.kind,id:u.id,data:u.data,deleted:u.deleted,ts:u.ts})))});
    part.forEach(u=>{if(u._js===null)delete S.hash[u._k];else S.hash[u._k]=u._js});
  }
  return up.length;
}
async function syncPull(){
  let total=0;
  for(;;){
    const rows=await sb('rows?select=co,kind,id,data,deleted,ts&ts=gt.'+S.lastPull+'&order=ts.asc&limit=1000');
    rows.forEach(r=>{
      const d=S.cos[r.co];if(!d)return;
      const arr=arrOf(d,r.kind),i=arr.findIndex(x=>x.id===r.id),key=r.co+'|'+r.kind+'|'+r.id;
      if(r.deleted){if(i>=0)arr.splice(i,1);delete S.hash[key]}
      else{if(i>=0)arr[i]=r.data;else arr.push(r.data);S.hash[key]=JSON.stringify(r.data)}
      S.lastPull=Math.max(S.lastPull,r.ts);
    });
    total+=rows.length;if(rows.length<1000)break;
  }
  return total;
}
function syncSoon(){if(!S.cfg.url||!S.sess)return;clearTimeout(t0);t0=setTimeout(()=>syncAll(false),1200)}
async function syncAll(manual){
  if(busy||!S.cfg.url||!S.sess)return;busy=true;setSyn('⟳');
  try{
    await syncPush();const n=await syncPull();S.last=Date.now();
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    setSyn('☁ ✓');if(n||manual)render();
  }catch(e){setSyn('☁ xato');if(manual)alert('Sinxron xato: '+e.message)}
  finally{busy=false}
}

}

function uzWords(n){
  n=Math.abs(Math.round(n));if(n===0)return'nol';
  const u=['','bir','ikki','uch','toʻrt','besh','olti','yetti','sakkiz','toʻqqiz'],t=['','oʻn','yigirma','oʻttiz','qirq','ellik','oltmish','yetmish','sakson','toʻqson'];
  const tri=x=>{let s='';const hh=Math.floor(x/100),r=x%100;if(hh)s+=u[hh]+' yuz ';if(r>=10)s+=t[Math.floor(r/10)]+' ';if(r%10)s+=u[r%10]+' ';return s};
  let out='';[[1e9,'milliard'],[1e6,'million'],[1e3,'ming'],[1,'']].forEach(([v,nm])=>{const q=Math.floor(n/v);if(q){out+=tri(q)+(nm?nm+' ':'');n%=v}});
  return out.trim();
}

async function uploadFile(file,meta){
  const slug=S.co.toLowerCase().replace(/[^a-z0-9]+/g,'-'),safe=file.name.replace(/[^\w.\-]+/g,'_');

  if(!r.ok)throw new Error('Yuklash xato: '+r.status+' '+(await r.text()).slice(0,120));

  const j=await r.json();if(!r.ok)throw new Error('Ochilmadi: '+(j.message||r.status));

}

  if(has('namuna','shablon','dalolatnoma','ustav','bayonnoma','buyruq','ishonchnoma','shartnoma'))return'“Namuna” boʻlimida shablonni tanlang, maydonlarni toʻldiring va “Hosil qilish”ni bosing. Natijani chop etish/PDF, Word yoki arxivga saqlash mumkin. Tayyor fayllaringizni “Arxiv” boʻlimiga yuklang.';
  if(has('orgat','qanday','nima','1c','didox','osv')){
    if(has('1c','osv'))return TEACH.osv;if(has('didox'))return TEACH.didox;if(has('bank','fayl','yukla'))return TEACH.bank;if(has('aylanma'))return TEACH.aylanma;if(has('qqs','soliq'))return taxOf(d).mode==='qqs'?TEACH.qqs:TEACH.aylanma;
    return'Nimani oʻrgatay? Yozing: “qqs”, “aylanma soliq”, “bank fayli”, “1c hisobot”, “didox”.';}
  if(has('qqs','soliq','aylanma'))return s.mode==='qqs'?`${S.month} uchun: sotuvdan QQS ${fmt(s.outVat)}, xariddan ${fmt(s.inVat)}. Toʻlanadigan QQS: ${fmt(s.pay)} soʻm.`:`${S.month} uchun aylanma ${fmt(s.sales)} soʻm, stavka ${s.rate}%. Aylanma soliq: ${fmt(s.turn)} soʻm (taxminiy).`;
  if(has('farq','bank','solishtir')){const b=r.rows.filter(x=>x.st!=='ok');return b.length||r.extra.length?`${b.length} ta hujjatda muammo, ${r.extra.length} ta bank harakati hujjatsiz.\n`+b.slice(0,5).map(x=>`• ${x.doc.no||'—'}: ${x.st==='diff'?'farq '+fmt(x.diff):'toʻlov topilmadi'}`).join('\n'):'Hammasi mos.'}
  if(has('muddat','eslat','qachon')){const l=d.dl.filter(x=>!x.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);return l.length?l.map(x=>`• ${x.title}: ${x.date} (${daysLeft(x.date)} kun)`).join('\n'):'Muddat qoʻyilmagan.'}
  if(has('qarz','tolanmagan','kim')){const db=debts(d),f=a=>a.slice(0,5).map(x=>`• ${x.party}: ${fmt(x.sum)}`).join('\n')||'—';return`Mijozlar sizga qarz (bank tasdiqlamagan):\n${f(db.rec)}\n\nSiz taʼminotchilarga:\n${f(db.pay)}`}
  if(has('xarid','xarajat','chiqim'))return`${S.month} xarid: ${fmt(s.buys)} soʻm.`;
  if(has('ishla','foyda','daromad','sotuv','savdo'))return`${S.month} sotuv: ${fmt(s.sales)}, xarid: ${fmt(s.buys)}. Farq: ${fmt(s.profit)} soʻm (${s.n} ta hujjat).`;
  return'Tushunmadim. Soʻrang: sotuv, xarid, QQS, bank bilan farq, qarz yoki muddatlar.';
}

function parseBank(t){
  let n=0;
  t.split('\n').forEach(line=>{
    const p=line.split(/[;\t]/).map(x=>x.trim());if(p.length<3)return;
    const raw=parseFloat(p[p.length-1].replace(/\s/g,'').replace(',','.'));
    if(!/^\d{4}-\d{2}-\d{2}/.test(p[0])||isNaN(raw))return;
    D().bank.push({id:uid(),date:p[0].slice(0,10),desc:p.slice(1,-1).join(' '),sum:Math.abs(raw),dir:raw<0?'out':'in'});n++;
  });
  return n;
}

  delbank(e){D().bank=D().bank.filter(x=>x.id!==e.dataset.id)},
  adddl(){if(!$('l_t').value.trim())return;D().dl.push({id:uid(),title:$('l_t').value.trim(),date:$('l_d').value,done:false})},
  qdl(e){D().dl.push({id:uid(),title:'QQS hisoboti ('+S.month+')',date:e.dataset.date,done:false});S.tab='muddat'},
  donedl(e){const x=D().dl.find(y=>y.id===e.dataset.id);x.done=!x.done},

  ask(){const q=$('q').value.trim();if(!q)return;D().chat.push({r:'u',t:q},{r:'a',t:answer(q)})},
  demo,
  exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(Object.assign({},S,{sess:null,hash:{},lastPull:0}))],{type:'application/json'}));a.download='buxgalter-zaxira.json';a.click();return 'norender'},
  imp(){$('file').click();return 'norender'},
  clr(){if(confirm(S.co+' maʼlumotini oʻchirasizmi? (arxiv fayllari bulutda qoladi)')){const t=D().tax,r=D().rek;S.cos[S.co]=blank();D().tax=t;if(r)D().rek=r}},
  chip(e){const q=e.dataset.q;D().chat.push({r:'u',t:q},{r:'a',t:answer(q)})},
  mapcancel(){PEND=null},
  upload(){

    const fs=Array.from($('ar_file').files||[]);if(!fs.length){alert('Fayl tanlang');return 'norender'}

  },

  delf(e){if(!confirm('Fayl oʻchirilsinmi?'))return 'norender';const f=D().files.find(x=>x.id===e.dataset.id);if(!f)return 'norender';

  cloudin(){
    const url=$('c_url').value.trim().replace(/\/+$/,''),key=$('c_key').value.trim(),em=$('c_em').value.trim(),pw=$('c_pw').value;

    if(!/^https:\/\//.test(url)||!key||!em||!pw){alert('URL, kalit, email va parolni toʻldiring');return 'norender'}
    S.cfg={url,key,email:em};
    cloudLogin(em,pw).then(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return syncAll(true)}).catch(e=>{alert(e.message);render()});

  cloudout(){S.sess=null;setSyn('')},

  mapbank(){
    const rows=PEND.rows,dc=+$('m_date').value,sc=+$('m_desc').value,ic=+$('m_in').value,oc=+$('m_out').value;
    if(ic<0&&oc<0)return alert('Kirim yoki summa ustunini tanlang');
    let n=0,skip=0;const d=D();
    rows.forEach(r=>{
      const dt=normDate(r[dc]);if(!dt)return;
      const iv=ic>=0?num(r[ic]):NaN,ov=oc>=0?num(r[oc]):NaN;let dir,sum;
      if(oc>=0){if(iv>0){dir='in';sum=iv}else if(ov>0){dir='out';sum=ov}else if(ov<0){dir='out';sum=-ov}else return}
      else{if(isNaN(iv)||iv===0)return;dir=iv<0?'out':'in';sum=Math.abs(iv)}
      const desc=String(r[sc]??'').slice(0,160);
      if(d.bank.some(b=>b.date===dt&&b.sum===sum&&b.dir===dir&&b.desc===desc)){skip++;return}
      d.bank.push({id:uid(),date:dt,desc,sum,dir});n++;
    });
    PEND=null;alert(n+' ta harakat qoʻshildi'+(skip?', '+skip+' ta takror oʻtkazildi':''));
  },
  mapdoc(){
    const rows=PEND.rows,dc=+$('m_date').value,nc=+$('m_no').value,pc=+$('m_party').value,sc=+$('m_sum').value,tc=+$('m_type').value;
    if(sc<0)return alert('Summa ustunini tanlang');
    let n=0,skip=0;const d=D();
    rows.forEach(r=>{
      const dt=normDate(r[dc]);if(!dt)return;
      const sum=Math.abs(num(r[sc]));if(!sum)return;
      let type=$('m_dtype').value;
      if(tc>=0){const t=String(r[tc]??'');if(/sot|chiq|реал|realiz|исход/i.test(t))type='sotuv';else if(/xar|kir|пост|вход/i.test(t))type='xarid'}
      const no=nc>=0?String(r[nc]??'').trim():'',party=pc>=0?String(r[pc]??'').trim():'';
      if(d.docs.some(x=>x.date===dt&&x.sum===sum&&x.no===no&&x.type===type)){skip++;return}
      d.docs.push({id:uid(),date:dt,no,party,type,sum,vat:$('m_dvat').value==='1'});n++;
    });
    PEND=null;alert(n+' ta hujjat qoʻshildi'+(skip?', '+skip+' ta takror oʻtkazildi':''));
  }
};

function render(){
  $('co').innerHTML=Object.keys(S.cos).map(c=>`<option ${c===S.co?'selected':''}>${c}</option>`).join('');
  $('mo').value=S.month;
  $('nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${S.tab===t[0]?'on':''}">${t[1]}</button>`).join('');
  $('v').innerHTML=V[S.tab]();
  const c=$('chat');if(c)c.scrollTop=c.scrollHeight;
  const hq=$('h_q'),ht=$('h_t');if(hq&&ht){const hl=()=>{S.hq=hq.value;S.ht=ht.value;$('hlist').innerHTML=docList()};hq.oninput=hl;ht.onchange=hl}
  const arf=$('ar_f');if(arf)arf.onchange=()=>{S.fc=arf.value;$('arlist').innerHTML=arList()};
  const sy=$('syn');if(sy)sy.textContent=S.sess?(busy?'⟳':'☁'):'';
  ['bank','doc'].forEach(k=>{const fi=$('f_'+k);if(fi)fi.onchange=()=>{const f=fi.files[0];if(!f)return;readRows(f).then(rows=>{PEND={kind:k,rows};render()}).catch(e=>alert(e.message))}});
  const f=$('file');if(f)f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.cos)throw 0;const oc=S.cfg,os=S.sess;S=j;S.cfg=oc||{};S.sess=os;S.hash={};S.lastPull=0;Object.keys(S.cos).forEach(c=>{S.cos[c].tax=S.cos[c].tax||Object.assign({},TAXDEF[c]||{mode:'qqs',rate:12});S.cos[c].files=S.cos[c].files||[]});save();render()}catch(e){alert('Fayl notoʻgʻri')}};r.readAsText(f.files[0])};
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t){S.tab=t.dataset.t;save();render();return}
  const a=e.target.closest('[data-a]');if(!a)return;
  const res=A[a.dataset.a](a);if(res==='norender')return;save();render();
});
$('co').onchange=e=>{S.co=e.target.value;save();render()};
$('mo').onchange=e=>{if(e.target.value){S.month=e.target.value;save();render()}};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){A.ask();save();render();$('q').focus()}});
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncAll(false)});
if(S.sess)syncAll(false);
